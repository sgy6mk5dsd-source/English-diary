<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>하루 한 줄 영어 일기 & 문법 교정</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --primary-dark: #3730a3;
      --text: #1e293b;
      --sub: #64748b;
      --border: #e2e8f0;
      --danger-bg: #fee2e2;
      --danger-text: #b91c1c;
      --success-bg: #dcfce7;
      --success-text: #15803d;
      --accent: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      padding-bottom: 60px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 8px;
    }

    header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.88rem;
      color: var(--sub);
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    /* 오늘의 주제 카드 */
    .topic-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .badge {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .btn-small {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-small:active {
      background: #e2e8f0;
    }

    .topic-en {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .topic-ko {
      font-size: 0.9rem;
      color: var(--sub);
      margin-bottom: 10px;
    }

    .topic-hint {
      background: #f8fafc;
      border-left: 3px solid var(--primary);
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 0.84rem;
      color: #475569;
    }

    /* 작성 영역 */
    .date-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .date-input {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.88rem;
      color: var(--text);
      background: #f8fafc;
    }

    .mood-group {
      display: flex;
      gap: 6px;
    }

    .mood-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      padding: 4px 8px;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.55;
      transition: all 0.15s;
    }

    .mood-btn.active {
      opacity: 1;
      border-color: var(--primary);
      background: var(--primary-light);
      transform: scale(1.06);
    }

    textarea {
      width: 100%;
      min-height: 115px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      font-size: 1rem;
      color: var(--text);
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .helper-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      margin-bottom: 12px;
      font-size: 0.82rem;
      color: var(--sub);
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      transition: background 0.15s, transform 0.1s;
    }

    .btn-primary:active {
      background: var(--primary-dark);
      transform: scale(0.99);
    }

    /* 교정 결과 영역 */
    .result-card {
      display: none;
      border: 2px solid #c7d2fe;
      background: #fafbff;
    }

    .result-card.show {
      display: block;
    }

    .result-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .compare-box {
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 0.96rem;
    }

    .compare-orig {
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .compare-fixed {
      background: var(--success-bg);
      color: var(--success-text);
      font-weight: 600;
    }

    .compare-label {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    .feedback-list {
      list-style: none;
      margin-top: 10px;
    }

    .feedback-list li {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.88rem;
      margin-bottom: 7px;
      color: #334155;
    }

    /* 기록장 영역 */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 22px 0 12px;
    }

    .history-header h2 {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .entry-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }

    .entry-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.84rem;
      color: var(--sub);
    }

    .entry-topic {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .entry-orig {
      font-size: 0.88rem;
      color: #94a3b8;
      text-decoration: line-through;
      margin-bottom: 4px;
    }

    .entry-fixed {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .entry-note {
      font-size: 0.82rem;
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
      color: #475569;
    }

    .del-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📖 하루 한 줄 영어 일기장</h1>
      <p>오늘의 주제로 영어를 쓰고 문법 교정까지 한 번에 기록해요</p>
    </header>

    <!-- 1. 오늘의 주제 카드 -->
    <section class="card">
      <div class="topic-header">
        <span class="badge">💡 오늘의 한 문장 주제</span>
        <button type="button" class="btn-small" onclick="nextTopic()">🔄 다른 주제 뽑기</button>
      </div>
      <div class="topic-en" id="topicEn"></div>
      <div class="topic-ko" id="topicKo"></div>
      <div class="topic-hint" id="topicHint"></div>
    </section>

    <!-- 2. 영어 일기 입력 카드 -->
    <section class="card">
      <div class="date-row">
        <input type="date" id="diaryDate" class="date-input" />
        <div class="mood-group" id="moodGroup">
          <button type="button" class="mood-btn active" data-mood="😊" onclick="selectMood(this)">😊</button>
          <button type="button" class="mood-btn" data-mood="🤩" onclick="selectMood(this)">🤩</button>
          <button type="button" class="mood-btn" data-mood="😴" onclick="selectMood(this)">😴</button>
          <button type="button" class="mood-btn" data-mood="😢" onclick="selectMood(this)">😢</button>
        </div>
      </div>

      <textarea id="diaryInput" placeholder="여기에 오늘의 영어 일기를 자유롭게 써보세요! (예: Yesterday I go to school and eat delicious lunch with my friend.)"></textarea>

      <div class="helper-bar">
        <span id="wordCount">0 단어</span>
        <button type="button" class="btn-small" onclick="fillSample()">✨ 예시 문장 채우기</button>
      </div>

      <button type="button" class="btn-primary" onclick="checkAndSave()">✍️ 문법 고치기 & 오늘 일기 저장</button>
    </section>

    <!-- 3. 문법 교정 결과 카드 -->
    <section class="card result-card" id="resultCard">
      <div class="result-title">✅ 문법 교정 리포트</div>
      <div class="compare-box compare-orig">
        <span class="compare-label">내가 쓴 문장 (원문)</span>
        <div id="origText"></div>
      </div>
      <div class="compare-box compare-fixed">
        <span class="compare-label">자연스럽게 고친 문장</span>
        <div id="fixedText"></div>
      </div>
      <ul class="feedback-list" id="feedbackList"></ul>
    </section>

    <!-- 4. 날짜별 일기 기록장 -->
    <div class="history-header">
      <h2>🗂️ 나의 일기 기록장 (<span id="totalCount">0</span>)</h2>
      <button type="button" class="btn-small" onclick="exportTxt()">📥 전체 저장(.txt)</button>
    </div>
    <div id="historyList"></div>
  </div>

  <script>
    const TOPICS = [
      {
        en: "What was the best part of your day today?",
        ko: "오늘 하루 중 가장 좋았던 순간은 무엇인가요?",
        hint: "힌트 시작: The best part of my day was..."
      },
      {
        en: "What did you eat for lunch, and how was it?",
        ko: "오늘 점심으로 무엇을 먹었고, 맛이 어땠나요?",
        hint: "힌트 시작: I had ... for lunch, and it was..."
      },
      {
        en: "What made you smile or laugh recently?",
        ko: "최근에 당신을 미소 짓게 하거나 웃게 만든 일은 무엇인가요?",
        hint: "힌트 시작: I smiled when..."
      },
      {
        en: "What is one thing you want to achieve this week?",
        ko: "이번 주에 꼭 이루고 싶은 한 가지는 무엇인가요?",
        hint: "힌트 시작: This week, I want to..."
      },
      {
        en: "Describe the weather today and how it made you feel.",
        ko: "오늘 날씨를 묘사하고 기분이 어땠는지 적어보세요.",
        hint: "힌트 시작: Today the weather was ..., so I felt..."
      },
      {
        en: "Who did you talk to the most today, and what about?",
        ko: "오늘 가장 대화를 많이 나눈 사람은 누구이고, 무슨 이야기를 했나요?",
        hint: "힌트 시작: I talked a lot with ... about..."
      },
      {
        en: "What song or video did you enjoy today?",
        ko: "오늘 즐겨 들은 노래나 재미있게 본 영상은 무엇인가요?",
        hint: "힌트 시작: Today I enjoyed listening to / watching..."
      }
    ];

    let currentTopicIndex = 0;
    let selectedMood = "😊";
    const STORAGE_KEY = "club_english_diary_v1";

    // 초기 날짜 설정 (오늘)
    function initDate() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, "0");
      const dd = String(today.getDate()).padStart(2, "0");
      document.getElementById("diaryDate").value = `${yyyy}-${mm}-${dd}`;
    }

    function renderTopic() {
      const t = TOPICS[currentTopicIndex];
      document.getElementById("topicEn").textContent = t.en;
      document.getElementById("topicKo").textContent = t.ko;
      document.getElementById("topicHint").textContent = t.hint;
    }

    function nextTopic() {
      currentTopicIndex = (currentTopicIndex + 1) % TOPICS.length;
      renderTopic();
    }

    function selectMood(btn) {
      document.querySelectorAll(".mood-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedMood = btn.dataset.mood;
    }

    document.getElementById("diaryInput").addEventListener("input", function () {
      const words = this.value.trim().split(/\s+/).filter(Boolean);
      document.getElementById("wordCount").textContent = `${words.length} 단어`;
    });

    function fillSample() {
      const samples = [
        "Yesterday i go to school with my friend and we eat delicious tteokbokki.",
        "Today I am very happy because i meet my best friend in cafe.",
        "I study english very hard yesterday, so I was very tired."
      ];
      const pick = samples[Math.floor(Math.random() * samples.length)];
      const input = document.getElementById("diaryInput");
      input.value = pick;
      input.dispatchEvent(new Event("input"));
    }

    // 스마트 내장 영문법 교정 엔진
    function correctEnglish(rawText) {
      let text = rawText.trim();
      const notes = [];

      // 1. 단독 소문자 'i' -> 대문자 'I'
      if (/i/.test(text)) {
        text = text.replace(/i/g, "I");
        notes.push("대명사 'I(나)'는 문장 위치와 관계없이 항상 대문자로 씁니다.");
      }

      // 2. 문장 첫 글자 대문자
      if (/^[a-z]/.test(text)) {
        text = text.charAt(0).toUpperCase() + text.slice(1);
        notes.push("문장의 첫 글자는 대문자로 시작해야 합니다.");
      }
      text = text.replace(/([.!?]\s+)([a-z])/g, (_, p1, p2) => p1 + p2.toUpperCase());

      // 3. 흔한 철자 및 콩글리시/전치사 교정
      const typoRules = [
        { regex: /english/g, replace: "English", msg: "언어 이름인 'English'는 첫 글자를 대문자로 씁니다." },
        { regex: /korean/g, replace: "Korean", msg: "언어/국적 이름인 'Korean'은 첫 글자를 대문자로 씁니다." },
        { regex: /yesterday/gi, replace: "yesterday", msg: null },
        { regex: /in cafe/gi, replace: "at a cafe", msg: "'카페에서'는 관사를 붙여 'at a cafe'로 쓰는 것이 자연스럽습니다." },
        { regex: /go to home/gi, replace: "go home", msg: "'home'이 부사로 쓰일 때는 전치사 'to' 없이 'go home'이라고 합니다." },
        { regex: /went to home/gi, replace: "went home", msg: "'home' 앞에는 전치사 'to'를 빼고 'went home'으로 씁니다." },
        { regex: /very delicious/gi, replace: "really delicious", msg: "'delicious'는 강한 형용사이므로 'very'보다 'really'와 더 잘 어울립니다." }
      ];

      typoRules.forEach(rule => {
        if (rule.regex.test(text)) {
          const before = text;
          text = text.replace(rule.regex, rule.replace);
          if (before !== text && rule.msg && !notes.includes(rule.msg)) {
            notes.push(rule.msg);
          }
        }
      });

      // 4. 과거 시제 표현(Yesterday / last / ago)이 있는데 현재형 동사를 쓴 경우 교정
      const isPastContext = /(yesterday|last night|last week|ago|was|were)/i.test(text);
      const pastVerbMap = [
        { present: /(I|we|they|you|he|she)\s+go/gi, past: "$1 went", desc: "go → went" },
        { present: /(I|we|they|you|he|she)\s+eat/gi, past: "$1 ate", desc: "eat → ate" },
        { present: /(I|we|they|you|he|she)\s+meet/gi, past: "$1 met", desc: "meet → met" },
        { present: /(I|we|they|you|he|she)\s+study/gi, past: "$1 studied", desc: "study → studied" },
        { present: /(I|we|they|you|he|she)\s+have/gi, past: "$1 had", desc: "have → had" },
        { present: /(I|we|they|you|he|she)\s+see/gi, past: "$1 saw", desc: "see → saw" },
        { present: /(I|we|they|you|he|she)\s+buy/gi, past: "$1 bought", desc: "buy → bought" },
        { present: /(I|we|they|you|he|she)\s+am/gi, past: "$1 was", desc: "am → was" },
        { present: /(we|they|you)\s+are/gi, past: "$1 were", desc: "are → were" },
        { present: /(he|she|it)\s+is/gi, past: "$1 was", desc: "is → was" },
        { present: /and\s+eat/gi, past: "and ate", desc: "eat → ate" },
        { present: /and\s+go/gi, past: "and went", desc: "go → went" }
      ];

      if (isPastContext) {
        const changedVerbs = [];
        pastVerbMap.forEach(item => {
          if (item.present.test(text)) {
            text = text.replace(item.present, item.past);
            changedVerbs.push(item.desc);
          }
        });
        if (changedVerbs.length > 0) {
          notes.push(`과거를 나타내는 표현이 있어 동사를 과거형(${changedVerbs.join(", ")})으로 교정했습니다.`);
        }
      }

      // 5. 주어-동사 수일치 (3인칭 단수)
      const agreementRules = [
        { regex: /(He|She|It)\s+have/g, replace: "$1 has", msg: "3인칭 단수 주어(He/She/It) 뒤에는 'have' 대신 'has'를 씁니다." },
        { regex: /(He|She|It)\s+don't/g, replace: "$1 doesn't", msg: "3인칭 단수 주어(He/She/It)의 부정은 'doesn't'를 씁니다." },
        { regex: /(I|You|We|They)\s+was/g, replace: "$1 were", msg: "'You/We/They' 뒤에는 과거형 be동사로 'were'를 씁니다." }
      ];
      agreementRules.forEach(rule => {
        if (rule.regex.test(text)) {
          text = text.replace(rule.regex, rule.replace);
          notes.push(rule.msg);
        }
      });

      // 6. 부정관사 a / an 교정
      if (/a\s+([aeiouAEIOU][a-zA-Z]*)/.test(text)) {
        text = text.replace(/a\s+([aeiouAEIOU][a-zA-Z]*)/g, (m, word) => {
          if (/^(uni|use|eu)/i.test(word)) return m;
          return `an ${word}`;
        });
        notes.push("모음 발음으로 시작하는 단어 앞에는 'a' 대신 'an'을 씁니다.");
      }

      // 7. 마침표 마무리
      if (!/[.!?]$/.test(text)) {
        text += ".";
        notes.push("문장 끝에 마침표(.)를 추가해 문장을 완성했습니다.");
      }

      if (notes.length === 0) {
        notes.push("문법적으로 아주 자연스럽고 정확한 문장입니다! 훌륭해요 👍");
      }

      return { fixed: text, notes };
    }

    function checkAndSave() {
      const inputEl = document.getElementById("diaryInput");
      const raw = inputEl.value.trim();
      if (!raw) {
        alert("먼저 영어 일기를 한 문장 이상 입력해 주세요!");
        inputEl.focus();
        return;
      }

      const { fixed, notes } = correctEnglish(raw);

      // 결과 카드 표시
      document.getElementById("origText").textContent = raw;
      document.getElementById("fixedText").textContent = fixed;
      const listEl = document.getElementById("feedbackList");
      listEl.innerHTML = notes.map(n => `<li>💡 ${n}</li>`).join("");
      document.getElementById("resultCard").classList.add("show");

      // 기록 저장
      const dateVal = document.getElementById("diaryDate").value || "오늘";
      const topicEn = TOPICS[currentTopicIndex].en;

      const entries = getEntries();
      entries.unshift({
        id: Date.now(),
        date: dateVal,
        mood: selectedMood,
        topic: topicEn,
        orig: raw,
        fixed: fixed,
        notes: notes
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));

      renderHistory();
      document.getElementById("resultCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function getEntries() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}

      // 처음 열었을 때 보여줄 동아리 시연용 기본 샘플 1개
      const defaultSample = [
        {
          id: 1,
          date: "2026-11-12",
          mood: "🤩",
          topic: "What was the best part of your day today?",
          orig: "Yesterday i go to English club and we talk about our favorite movies.",
          fixed: "Yesterday I went to English club and we talked about our favorite movies.",
          notes: [
            "대명사 'I(나)'는 항상 대문자로 씁니다.",
            "과거 표현(Yesterday)에 맞춰 동사를 과거형(went, talked)으로 교정했습니다."
          ]
        }
      ];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultSample));
      return defaultSample;
    }

    function deleteEntry(id) {
      if (!confirm("이 일기 기록을 삭제할까요?")) return;
      const entries = getEntries().filter(item => item.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      renderHistory();
    }

    function renderHistory() {
      const entries = getEntries();
      document.getElementById("totalCount").textContent = entries.length;
      const container = document.getElementById("historyList");

      if (entries.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center; color:#94a3b8;">아직 저장된 일기가 없어요. 첫 영어 일기를 써보세요!</div>`;
        return;
      }

      container.innerHTML = entries.map(item => `
        <div class="entry-item">
          <div class="entry-top">
            <span><strong>${item.date}</strong> ${item.mood}</span>
            <button type="button" class="del-btn" onclick="deleteEntry(${item.id})">삭제</button>
          </div>
          <div class="entry-topic">Q. ${item.topic}</div>
          ${item.orig !== item.fixed ? `<div class="entry-orig">${item.orig}</div>` : ""}
          <div class="entry-fixed">${item.fixed}</div>
          <div class="entry-note">${item.notes.map(n => `• ${n}`).join("<br/>")}</div>
        </div>
      `).join("");
    }

    function exportTxt() {
      const entries = getEntries();
      if (entries.length === 0) {
        alert("내보낼 일기 기록이 없습니다.");
        return;
      }
      const lines = entries.map(e =>
        `[${e.date} ${e.mood}]
주제: ${e.topic}
원문: ${e.orig}
교정: ${e.fixed}
해설: ${e.notes.join(" / ")}
----------------------------------------`
      ).join("

");

      const blob = new Blob([lines], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "영어일기_문법교정기록.txt";
      a.click();
      URL.revokeObjectURL(url);
    }

    // 초기화 실행
    initDate();
    renderTopic();
    renderHistory();
  </script>
</body>
</html>
